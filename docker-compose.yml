name: omnifix-private-scanner
services:
  api:
    build:
      context: .
      dockerfile: deployment/docker/backend.Dockerfile
    image: omnifix-private-scanner:1.0.0
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      DATA_DIR: /app/storage
      FRONTEND_DIR: /app/frontend/out
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ./storage:/app/storage
    expose:
      - "8000"
    mem_limit: 1024m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    image: omnifix-private-scanner:1.0.0
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATA_DIR: /app/storage
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      WORKER_MEMORY_MB: ${WORKER_MEMORY_MB:-1200}
    command: ["python", "-m", "app.workers.runner"]
    volumes:
      - ./storage:/app/storage
    mem_limit: 1536m
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
