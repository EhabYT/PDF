# Cloudflare Workers Builds guard configuration.
#
# This repository is a full-stack Python + Next.js application. The real app
# cannot run as a Cloudflare Worker. If a Cloudflare Workers Builds integration
# remains connected and runs `npx wrangler deploy`, this configuration deploys a
# small static notice page instead of failing with "Could not detect a directory
# containing static files".
#
# It does NOT deploy the OmniFix API, worker, OCR, or private storage.
# For the real application, disconnect Workers Builds and use Docker +
# Cloudflare Tunnel + Access: docs/CLOUDFLARE_TUNNEL.md

account_id = "004fe70f748804a3fbce22da0360719f"
name = "pdf"
main = "cloudflare-worker/worker.js"
compatibility_date = "2026-11-06"

[assets]
directory = "cloudflare-worker/public"
binding = "ASSETS"
